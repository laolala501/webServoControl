<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP32 双舵机远程控制</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #e8f0fa; }
    main { width: min(92vw, 620px); padding: 28px; border: 1px solid #29415e; border-radius: 20px; background: #101d2d; box-shadow: 0 20px 70px #0008; }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    .status { display: flex; gap: 8px; align-items: center; color: #9fb0c3; margin-bottom: 22px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #788492; }
    .dot.online { background: #35d07f; box-shadow: 0 0 12px #35d07f; }
    details { border: 1px solid #29415e; border-radius: 12px; padding: 12px; margin-bottom: 22px; }
    summary { cursor: pointer; font-weight: 650; }
    .settings { display: grid; gap: 10px; margin-top: 14px; }
    label { color: #adbdcf; font-size: .9rem; }
    input[type=text], input[type=password] { width: 100%; margin-top: 5px; padding: 10px 12px; border: 1px solid #38516e; border-radius: 8px; background: #091522; color: white; }
    button { padding: 11px 16px; border: 0; border-radius: 9px; font-weight: 700; cursor: pointer; background: #50a7ff; color: #04101d; }
    button.disconnect { background: #ff667a; }
    .servo { padding: 20px 0; border-top: 1px solid #29415e; }
    .servo:first-of-type { border-top: 0; }
    .servo-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
    .angle { font-size: 1.7rem; color: #65b5ff; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: #50a7ff; }
    .ticks { display: flex; justify-content: space-between; color: #71859b; font-size: .8rem; }
    .hint { margin: 16px 0 0; color: #7f92a8; font-size: .82rem; line-height: 1.5; }
  </style>
</head>
<body>
<main>
  <h1>ESP32 双舵机控制</h1>
  <div class="status"><span id="dot" class="dot"></span><span id="status">尚未连接</span></div>

  <details open>
    <summary>HiveMQ Cloud 连接设置</summary>
    <div class="settings">
      <label>MQTT URL（只填主机名）<input id="host" type="text" placeholder="xxxx.s1.eu.hivemq.cloud" autocomplete="off"></label>
      <label>用户名<input id="username" type="text" autocomplete="username"></label>
      <label>密码<input id="password" type="password" autocomplete="current-password"></label>
      <label>Device ID（需与 .ino 相同）<input id="deviceId" type="text" value="esp32-servo-01"></label>
      <button id="connect">连接</button>
    </div>
  </details>

  <section class="servo">
    <div class="servo-head"><strong>舵机 1 · GPIO 18</strong><output id="angle1" class="angle">90°</output></div>
    <input id="servo1" type="range" min="0" max="180" value="90" disabled aria-label="舵机 1 角度">
    <div class="ticks"><span>0°</span><span>90°</span><span>180°</span></div>
  </section>
  <section class="servo">
    <div class="servo-head"><strong>舵机 2 · GPIO 19</strong><output id="angle2" class="angle">90°</output></div>
    <input id="servo2" type="range" min="0" max="180" value="90" disabled aria-label="舵机 2 角度">
    <div class="ticks"><span>0°</span><span>90°</span><span>180°</span></div>
  </section>
  <p class="hint">设置仅保存在本标签页，关闭后清除。网页通过 WSS 8884 连接；ESP32 通过 TLS 8883 连接。</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.14.1/dist/mqtt.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const ui = {
    host: $('host'), username: $('username'), password: $('password'), deviceId: $('deviceId'),
    button: $('connect'), status: $('status'), dot: $('dot'),
    sliders: [$('servo1'), $('servo2')], outputs: [$('angle1'), $('angle2')]
  };
  let client = null;
  let prefix = '';
  const timers = [null, null];

  for (const key of ['host', 'username', 'deviceId']) {
    ui[key].value = sessionStorage.getItem(key) || ui[key].value;
  }

  function setStatus(text, online = false) {
    ui.status.textContent = text;
    ui.dot.classList.toggle('online', online);
  }

  function cleanHost(value) {
    return value.trim().replace(/^wss?:\/\//i, '').replace(/:\d+.*$/, '').replace(/\/$/, '');
  }

  function setControls(enabled) {
    ui.sliders.forEach(slider => slider.disabled = !enabled);
  }

  function disconnect() {
    if (client) client.end(true);
    client = null;
    setControls(false);
    setStatus('已断开');
    ui.button.textContent = '连接';
    ui.button.classList.remove('disconnect');
  }

  function connect() {
    if (client) return disconnect();
    const host = cleanHost(ui.host.value);
    const username = ui.username.value.trim();
    const password = ui.password.value;
    const deviceId = ui.deviceId.value.trim();
    if (!host || !username || !password || !/^[A-Za-z0-9_-]+$/.test(deviceId)) {
      setStatus('请完整填写设置；Device ID 只可用字母、数字、_、-');
      return;
    }
    if (!window.mqtt) {
      setStatus('MQTT.js 加载失败，请检查网络或 CDN');
      return;
    }

    ui.host.value = host;
    for (const key of ['host', 'username', 'deviceId']) sessionStorage.setItem(key, ui[key].value);
    prefix = `servo-control/${deviceId}`;
    setStatus('正在连接 HiveMQ…');
    ui.button.disabled = true;

    client = mqtt.connect(`wss://${host}:8884/mqtt`, {
      username, password,
      clientId: `web-${deviceId}-${crypto.randomUUID().slice(0, 8)}`,
      clean: true, connectTimeout: 10000, reconnectPeriod: 3000
    });

    client.on('connect', () => {
      client.subscribe([`${prefix}/servo1/state`, `${prefix}/servo2/state`, `${prefix}/status`], { qos: 1 });
      setControls(true);
      setStatus('MQTT 已连接，等待设备状态…', true);
      ui.button.disabled = false;
      ui.button.textContent = '断开';
      ui.button.classList.add('disconnect');
    });
    client.on('reconnect', () => setStatus('连接中断，正在重连…'));
    client.on('offline', () => { setControls(false); setStatus('MQTT 离线'); });
    client.on('error', err => { setStatus(`连接错误：${err.message}`); ui.button.disabled = false; });
    client.on('message', (topic, payload) => {
      const value = payload.toString();
      if (topic === `${prefix}/status`) {
        const online = value === 'online';
        setStatus(online ? '设备在线' : 'MQTT 已连接，但设备离线', online);
        setControls(online);
        return;
      }
      const match = topic.match(/\/servo([12])\/state$/);
      const angle = Number(value);
      if (match && Number.isInteger(angle) && angle >= 0 && angle <= 180) {
        const i = Number(match[1]) - 1;
        ui.sliders[i].value = angle;
        ui.outputs[i].textContent = `${angle}°`;
      }
    });
  }

  ui.button.addEventListener('click', connect);
  ui.sliders.forEach((slider, i) => slider.addEventListener('input', () => {
    const angle = slider.value;
    ui.outputs[i].textContent = `${angle}°`;
    clearTimeout(timers[i]);
    timers[i] = setTimeout(() => {
      if (client?.connected) client.publish(`${prefix}/servo${i + 1}/set`, angle, { qos: 1, retain: false });
    }, 70);
  }));
})();
</script>
</body>
</html>
