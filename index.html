<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ESP8266 远程遥控器</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px 40px 40px 40px;
            border-radius: 32px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #1e293b;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        .status-badge {
            background: #e2e8f0;
            color: #475569;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 2rem;
        }
        button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            transition: all 0.2s ease;
            background-color: #ef4444;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin: 20px 0;
        }
        button.active {
            background-color: #22c55e;
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }
        button:active {
            transform: scale(0.96);
        }
        .info-text {
            margin: 20px 0 10px;
            color: #475569;
            font-size: 0.9rem;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .log-area {
            margin-top: 20px;
            padding: 12px;
            background: #0f172a;
            color: #a5f3c3;
            border-radius: 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .log-area div {
            padding: 4px 0;
            border-bottom: 1px solid #1e293b;
            word-break: break-all;
        }
        footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #94a3b8;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🚀 ESP8266 遥控器</h1>
    <div class="status-badge" id="mqttStatus">⚙️ 正在连接服务器...</div>
    <button id="controlBtn">⚪ 关闭</button>
    <div class="info-text">
        📡 主题：<strong id="topicName">esp8266/banana/command</strong>
    </div>
    <div class="log-area" id="logArea">
        <div>📌 系统日志：</div>
    </div>
    <footer>通过 MQTT 远程控制 | HiveMQ Cloud</footer>
</div>

<script>
    // ==================== 配置区（请勿随意修改）====================
    const COMMAND_TOPIC = "esp8266/banana/command";
    const BROKER_URL = "wss://cbbc9551f4684ab19662c01b6972d3f1.s1.eu.hivemq.cloud:8884/mqtt";
    const USERNAME = "laolala501";
    const PASSWORD = "Laola501";
    // =============================================================

    // DOM 元素
    const btn = document.getElementById('controlBtn');
    const mqttStatusSpan = document.getElementById('mqttStatus');
    const logArea = document.getElementById('logArea');
    const topicNameSpan = document.getElementById('topicName');
    topicNameSpan.innerText = COMMAND_TOPIC;

    // 添加日志
    function addLog(message) {
        const logEntry = document.createElement('div');
        const timestamp = new Date().toLocaleTimeString();
        logEntry.textContent = `[${timestamp}] ${message}`;
        logArea.appendChild(logEntry);
        logEntry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        console.log(message);
    }

    // 按钮状态
    let isActive = false;
    let mqttClient = null;

    // 更新按钮外观
    function updateButtonVisual() {
        if (isActive) {
            btn.classList.add('active');
            btn.innerHTML = '✅ 开启 (1)';
        } else {
            btn.classList.remove('active');
            btn.innerHTML = '❌ 关闭 (0)';
        }
    }

    // 发布状态到 MQTT
    function publishState(state) {
        const msg = state ? "1" : "0";
        addLog(`📤 发送指令：${msg}`);
        if (mqttClient && mqttClient.connected) {
            mqttClient.publish(COMMAND_TOPIC, msg, { qos: 1 }, (err) => {
                if (err) {
                    addLog(`❌ 发送失败：${err.message}`);
                } else {
                    addLog(`✅ 指令“${msg}”已成功发送至 Broker`);
                }
            });
        } else {
            addLog(`⚠️ MQTT 未连接，无法发送指令`);
        }
    }

    // 切换按钮状态
    function toggleState() {
        isActive = !isActive;
        updateButtonVisual();
        publishState(isActive);
    }

    // 连接 MQTT（WebSocket Secure）
    function connectMQTT() {
        const clientId = `web-${Math.random().toString(16).substring(2, 10)}`;
        addLog(`🔌 正在连接 MQTT Broker（WSS）...`);
        mqttStatusSpan.innerText = "⚙️ 正在连接...";
        mqttStatusSpan.style.backgroundColor = "#facc15";
        mqttStatusSpan.style.color = "#1e293b";

        mqttClient = mqtt.connect(BROKER_URL, {
            clientId: clientId,
            username: USERNAME,
            password: PASSWORD,
            clean: true,
            reconnectPeriod: 5000,
            connectTimeout: 30000,
            keepalive: 60
        });

        mqttClient.on('connect', () => {
            addLog(`✅ MQTT 连接成功 (Client ID: ${clientId})`);
            mqttStatusSpan.innerText = "✅ 已连接 (WSS)";
            mqttStatusSpan.style.backgroundColor = "#22c55e";
            mqttStatusSpan.style.color = "white";
            // 订阅主题（用于接收可能的反馈）
            mqttClient.subscribe(COMMAND_TOPIC, { qos: 1 }, (err) => {
                if (!err) {
                    addLog(`📡 已订阅主题：${COMMAND_TOPIC}`);
                } else {
                    addLog(`⚠️ 订阅主题失败：${err}`);
                }
            });
        });

        mqttClient.on('message', (topic, message) => {
            const msgStr = message.toString();
            addLog(`📨 收到消息 [${topic}]：${msgStr}`);
            if (topic === COMMAND_TOPIC) {
                const newState = (msgStr === "1");
                if (newState !== isActive) {
                    isActive = newState;
                    updateButtonVisual();
                    addLog(`🔄 根据外部指令同步按钮状态为 ${msgStr}`);
                }
            }
        });

        mqttClient.on('error', (err) => {
            addLog(`❌ MQTT 错误：${err.message}`);
            mqttStatusSpan.innerText = "❌ 连接错误";
            mqttStatusSpan.style.backgroundColor = "#ef4444";
            mqttStatusSpan.style.color = "white";
        });

        mqttClient.on('reconnect', () => {
            addLog(`🔄 MQTT 正在重连...`);
            mqttStatusSpan.innerText = "🔄 重连中...";
            mqttStatusSpan.style.backgroundColor = "#facc15";
            mqttStatusSpan.style.color = "#1e293b";
        });

        mqttClient.on('offline', () => {
            addLog(`⚠️ MQTT 客户端离线`);
            mqttStatusSpan.innerText = "⚠️ 离线";
            mqttStatusSpan.style.backgroundColor = "#9ca3af";
            mqttStatusSpan.style.color = "white";
        });
    }

    // 绑定按钮点击事件
    btn.addEventListener('click', () => {
        if (mqttClient && mqttClient.connected) {
            toggleState();
        } else {
            addLog(`⚠️ 当前未连接 MQTT，尝试重新连接...`);
            connectMQTT();
        }
    });

    // 启动连接
    connectMQTT();
</script>
</body>
</html>
