<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ESP32 四舵机遥控器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 30px 35px 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            max-width: 600px;
            width: 100%;
            color: #f1f5f9;
        }
        h1 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.8rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            text-align: center;
            font-size: 0.85rem;
            background: #334155;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            margin: 0 auto 25px;
            color: #94a3b8;
        }
        .servo-group {
            background: #0f172a;
            border-radius: 24px;
            padding: 18px 20px 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            transition: border-color 0.3s;
        }
        .servo-group:hover {
            border-color: #60a5fa;
        }
        .servo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .servo-label {
            font-weight: 600;
            color: #cbd5e1;
        }
        .servo-value {
            background: #1e293b;
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: bold;
            color: #60a5fa;
            font-size: 1.1rem;
            min-width: 48px;
            text-align: center;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 10px;
            outline: none;
            transition: background 0.2s;
            margin-top: 8px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #60a5fa;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.4);
            transition: 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #60a5fa;
            cursor: pointer;
            border: none;
        }
        .log-area {
            margin-top: 25px;
            background: #0f172a;
            border-radius: 20px;
            padding: 12px 16px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            color: #a5f3c3;
            border: 1px solid #1e293b;
        }
        .log-area div {
            padding: 3px 0;
            border-bottom: 1px solid #1e293b;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            color: #475569;
            font-size: 0.7rem;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🛠️ 四舵机遥控</h1>
    <div style="text-align:center;">
        <span class="status-badge" id="mqttStatus">⚙️ 正在连接...</span>
    </div>

    <!-- 四个舵机滑块 -->
    <div id="servoContainer">
        <!-- 舵机1 -->
        <div class="servo-group">
            <div class="servo-header">
                <span class="servo-label">舵机 #1 (GPIO18)</span>
                <span class="servo-value" id="val1">90</span>
            </div>
            <input type="range" id="slider1" min="0" max="180" value="90" step="1">
        </div>
        <!-- 舵机2 -->
        <div class="servo-group">
            <div class="servo-header">
                <span class="servo-label">舵机 #2 (GPIO19)</span>
                <span class="servo-value" id="val2">90</span>
            </div>
            <input type="range" id="slider2" min="0" max="180" value="90" step="1">
        </div>
        <!-- 舵机3 -->
        <div class="servo-group">
            <div class="servo-header">
                <span class="servo-label">舵机 #3 (GPIO21)</span>
                <span class="servo-value" id="val3">90</span>
            </div>
            <input type="range" id="slider3" min="0" max="180" value="90" step="1">
        </div>
        <!-- 舵机4 -->
        <div class="servo-group">
            <div class="servo-header">
                <span class="servo-label">舵机 #4 (GPIO22)</span>
                <span class="servo-value" id="val4">90</span>
            </div>
            <input type="range" id="slider4" min="0" max="180" value="90" step="1">
        </div>
    </div>

    <div class="log-area" id="logArea">
        <div>📌 系统日志：</div>
    </div>
    <footer>通过 MQTT 远程控制 | HiveMQ Cloud</footer>
</div>

<script>
    // ========== 配置（与 ESP32 代码一致）==========
    const TOPICS = [
        "esp32/servo/1",
        "esp32/servo/2",
        "esp32/servo/3",
        "esp32/servo/4"
    ];
    const BROKER_URL = "wss://cbbc9551f4684ab19662c01b6972d3f1.s1.eu.hivemq.cloud:8884/mqtt";
    const USERNAME = "laolala501";
    const PASSWORD = "Laola501";
    // ============================================

    // DOM 元素
    const sliders = [
        document.getElementById('slider1'),
        document.getElementById('slider2'),
        document.getElementById('slider3'),
        document.getElementById('slider4')
    ];
    const valueSpans = [
        document.getElementById('val1'),
        document.getElementById('val2'),
        document.getElementById('val3'),
        document.getElementById('val4')
    ];
    const logArea = document.getElementById('logArea');
    const mqttStatusSpan = document.getElementById('mqttStatus');

    let mqttClient = null;

    // 日志
    function addLog(msg) {
        const div = document.createElement('div');
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logArea.appendChild(div);
        logArea.scrollTop = logArea.scrollHeight;
        console.log(msg);
    }

    // 发布角度
    function publishAngle(index, angle) {
        const topic = TOPICS[index];
        const payload = angle.toString();
        if (mqttClient && mqttClient.connected) {
            mqttClient.publish(topic, payload, { qos: 1 }, (err) => {
                if (err) addLog(`❌ 舵机${index+1} 发送失败: ${err.message}`);
                else addLog(`✅ 舵机${index+1} → ${angle}°`);
            });
        } else {
            addLog(`⚠️ MQTT 未连接，舵机${index+1} 角度 ${angle}° 未发送`);
        }
    }

    // 绑定滑块事件
    function initSliders() {
        for (let i = 0; i < 4; i++) {
            const slider = sliders[i];
            const span = valueSpans[i];
            // 初始显示
            span.textContent = slider.value;
            // 输入事件
            slider.addEventListener('input', function() {
                const val = parseInt(this.value);
                span.textContent = val;
                publishAngle(i, val);
            });
        }
    }

    // 连接 MQTT
    function connectMQTT() {
        const clientId = `web-${Math.random().toString(16).substr(2, 8)}`;
        addLog(`🔌 连接 MQTT (WSS)...`);
        mqttStatusSpan.textContent = "⚙️ 连接中...";
        mqttStatusSpan.style.color = "#facc15";

        mqttClient = mqtt.connect(BROKER_URL, {
            clientId: clientId,
            username: USERNAME,
            password: PASSWORD,
            clean: true,
            reconnectPeriod: 5000,
            connectTimeout: 30000,
            keepalive: 60
        });

        mqttClient.on('connect', () => {
            addLog(`✅ MQTT 连接成功 (ID: ${clientId})`);
            mqttStatusSpan.textContent = "✅ 已连接 (WSS)";
            mqttStatusSpan.style.color = "#4ade80";
            // 订阅所有主题（用于同步其他客户端，可选）
            for (let t of TOPICS) {
                mqttClient.subscribe(t, { qos: 1 }, (err) => {
                    if (!err) addLog(`📡 已订阅 ${t}`);
                });
            }
        });

        mqttClient.on('message', (topic, message) => {
            const msgStr = message.toString();
            const angle = parseInt(msgStr);
            if (isNaN(angle)) return;
            // 找到对应舵机索引
            const idx = TOPICS.indexOf(topic);
            if (idx === -1) return;
            // 更新滑块（但避免触发 publish 循环）
            const slider = sliders[idx];
            const span = valueSpans[idx];
            if (slider.value != angle) {
                slider.value = angle;
                span.textContent = angle;
                addLog(`🔄 舵机${idx+1} 同步为 ${angle}° (外部)`);
            }
        });

        mqttClient.on('error', (err) => {
            addLog(`❌ MQTT 错误: ${err.message}`);
            mqttStatusSpan.textContent = "❌ 错误";
            mqttStatusSpan.style.color = "#f87171";
        });

        mqttClient.on('reconnect', () => {
            addLog(`🔄 重连中...`);
            mqttStatusSpan.textContent = "🔄 重连...";
            mqttStatusSpan.style.color = "#facc15";
        });

        mqttClient.on('offline', () => {
            addLog(`⚠️ 离线`);
            mqttStatusSpan.textContent = "⚠️ 离线";
            mqttStatusSpan.style.color = "#94a3b8";
        });
    }

    // 初始化
    initSliders();
    connectMQTT();
</script>
</body>
</html>
