<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ESP32 双舵机远程控制</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 520px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fa;
            color: #2c3e50;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 24px;
        }

        .config-box,
        .slider-container {
            margin: 18px 0;
            padding: 22px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        .config-box {
            border: 1px solid #ffd66b;
            background: #fffaf0;
            text-align: left;
        }

        .config-box h3 {
            margin-top: 0;
            color: #856404;
        }

        label {
            display: block;
            margin: 12px 0 5px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 0.9rem;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 7px;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
        }

        #connectButton {
            background: #1677ff;
        }

        #connectButton:hover {
            background: #095ec5;
        }

        #disconnectButton {
            background: #64748b;
        }

        #disconnectButton:hover {
            background: #475569;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .slider-container h2 {
            margin-top: 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #64748b;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #1677ff;
        }

        .angle-value {
            margin-top: 12px;
            color: #1677ff;
            font-size: 1.8rem;
            font-weight: 700;
        }

        #status {
            margin-top: 22px;
            padding: 12px;
            background: white;
            border-radius: 9px;
            color: #64748b;
            font-weight: 600;
        }

        .hint {
            margin-top: 18px;
            padding: 12px;
            background: #eaf2f8;
            border-radius: 8px;
            color: #64748b;
            font-size: 0.85rem;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <h1>🤖 ESP32 双舵机遥控器</h1>

    <div class="config-box">
        <h3>🔐 HiveMQ Cloud 配置</h3>

        <label for="mqttUrl">安全 WebSocket 地址</label>
        <input
            type="text"
            id="mqttUrl"
            value="wss://6f6fcbc531074775a121762c2c89047f.s1.eu.hivemq.cloud:8884/mqtt"
            autocomplete="off"
        >

        <label for="mqttUser">MQTT 用户名</label>
        <input
            type="text"
            id="mqttUser"
            placeholder="请输入 HiveMQ MQTT 用户名"
            autocomplete="username"
        >

        <label for="mqttPass">MQTT 密码</label>
        <input
            type="password"
            id="mqttPass"
            placeholder="请输入 HiveMQ MQTT 密码"
            autocomplete="current-password"
        >

        <div class="button-row">
            <button id="connectButton" type="button">
                连接 MQTT
            </button>

            <button id="disconnectButton" type="button" disabled>
                断开连接
            </button>
        </div>
    </div>

    <div class="slider-container">
        <h2>舵机 1（GPIO 18）</h2>

        <div class="slider-label">
            <span>0°</span>
            <span>90°</span>
            <span>180°</span>
        </div>

        <input
            type="range"
            id="servo1"
            min="0"
            max="180"
            step="1"
            value="90"
        >

        <div class="angle-value" id="value1">90°</div>
    </div>

    <div class="slider-container">
        <h2>舵机 2（GPIO 19）</h2>

        <div class="slider-label">
            <span>0°</span>
            <span>90°</span>
            <span>180°</span>
        </div>

        <input
            type="range"
            id="servo2"
            min="0"
            max="180"
            step="1"
            value="90"
        >

        <div class="angle-value" id="value2">90°</div>
    </div>

    <div id="status">⏳ 请输入账号密码，然后点击“连接 MQTT”</div>

    <div class="hint">
        ESP32 使用 MQTT TLS 端口 8883<br>
        网页使用安全 WebSocket 端口 8884<br>
        消息格式：{"angle": 90}
    </div>

    <!-- MQTT.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.5.4/mqtt.min.js"></script>

    <script>
        const MQTT_TOPIC_1 = "esp32/servo1/control";
        const MQTT_TOPIC_2 = "esp32/servo2/control";

        const slider1 = document.getElementById("servo1");
        const slider2 = document.getElementById("servo2");
        const value1 = document.getElementById("value1");
        const value2 = document.getElementById("value2");

        const mqttUrlInput = document.getElementById("mqttUrl");
        const mqttUserInput = document.getElementById("mqttUser");
        const mqttPassInput = document.getElementById("mqttPass");

        const connectButton =
            document.getElementById("connectButton");

        const disconnectButton =
            document.getElementById("disconnectButton");

        const statusDiv = document.getElementById("status");

        let client = null;
        let isConnected = false;
        let lastError = "";

        // 避免拖动滑块时短时间发送过多消息
        let servo1Timer = null;
        let servo2Timer = null;

        function setStatus(message, color) {
            statusDiv.textContent = message;
            statusDiv.style.color = color;
        }

        function setConnectedState(connected) {
            isConnected = connected;

            connectButton.disabled = connected;
            disconnectButton.disabled = !connected;

            mqttUrlInput.disabled = connected;
            mqttUserInput.disabled = connected;
            mqttPassInput.disabled = connected;
        }

        function createClientId() {
            const randomPart = Math.random()
                .toString(16)
                .slice(2, 10);

            return "web-servo-" + Date.now() + "-" + randomPart;
        }

        function connectMQTT() {
            const brokerUrl = mqttUrlInput.value.trim();
            const username = mqttUserInput.value.trim();
            const password = mqttPassInput.value;

            if (typeof mqtt === "undefined") {
                setStatus(
                    "❌ MQTT.js 加载失败，请检查网络连接",
                    "#e74c3c"
                );
                return;
            }

            if (!brokerUrl) {
                setStatus("⚠️ 请输入 WebSocket 地址", "#f39c12");
                mqttUrlInput.focus();
                return;
            }

            if (!brokerUrl.startsWith("wss://")) {
                setStatus(
                    "⚠️ 地址必须以 wss:// 开头",
                    "#f39c12"
                );
                mqttUrlInput.focus();
                return;
            }

            if (!username || !password) {
                setStatus(
                    "⚠️ 请输入 MQTT 用户名和密码",
                    "#f39c12"
                );
                return;
            }

            // 清理之前创建的客户端
            if (client) {
                client.removeAllListeners();
                client.end(true);
                client = null;
            }

            lastError = "";
            setConnectedState(false);
            connectButton.disabled = true;

            setStatus("⏳ 正在连接 HiveMQ Cloud...", "#f39c12");

            const options = {
                clientId: createClientId(),

                username: username,
                password: password,

                // 使用 MQTT 3.1.1，兼容性较好
                protocolVersion: 4,

                clean: true,
                keepalive: 60,

                // 自动重连间隔
                reconnectPeriod: 3000,

                // 连接超时
                connectTimeout: 10 * 1000
            };

            try {
                const newClient = mqtt.connect(brokerUrl, options);
                client = newClient;

                newClient.on("connect", function () {
                    // 防止旧客户端事件影响新客户端
                    if (client !== newClient) {
                        return;
                    }

                    lastError = "";
                    setConnectedState(true);

                    setStatus(
                        "✅ MQTT 已连接，可以控制舵机",
                        "#27ae60"
                    );

                    console.log(
                        "MQTT connected:",
                        newClient.options.clientId
                    );

                    // 连接成功后发送当前角度
                    publishAngle(
                        MQTT_TOPIC_1,
                        Number(slider1.value)
                    );

                    publishAngle(
                        MQTT_TOPIC_2,
                        Number(slider2.value)
                    );
                });

                newClient.on("reconnect", function () {
                    if (client !== newClient) {
                        return;
                    }

                    setConnectedState(false);
                    connectButton.disabled = true;

                    setStatus(
                        "🔄 MQTT 正在重新连接...",
                        "#f39c12"
                    );
                });

                newClient.on("offline", function () {
                    if (client !== newClient) {
                        return;
                    }

                    setConnectedState(false);
                    connectButton.disabled = true;

                    setStatus(
                        "⚠️ MQTT 网络离线，等待重连...",
                        "#e67e22"
                    );
                });

                newClient.on("error", function (error) {
                    if (client !== newClient) {
                        return;
                    }

                    lastError = error.message || String(error);

                    setStatus(
                        "❌ MQTT 错误：" + lastError,
                        "#e74c3c"
                    );

                    console.error("MQTT error:", error);
                });

                newClient.on("close", function () {
                    if (client !== newClient) {
                        return;
                    }

                    setConnectedState(false);

                    // reconnectPeriod 不为 0 时会自动重连
                    connectButton.disabled = true;

                    if (lastError) {
                        setStatus(
                            "❌ 连接断开：" +
                            lastError +
                            "；3 秒后重试",
                            "#e74c3c"
                        );
                    } else {
                        setStatus(
                            "⚠️ MQTT 连接断开，3 秒后重试...",
                            "#e67e22"
                        );
                    }

                    console.warn("MQTT connection closed");
                });

            } catch (error) {
                client = null;
                connectButton.disabled = false;

                setStatus(
                    "❌ 连接异常：" + error.message,
                    "#e74c3c"
                );

                console.error("MQTT exception:", error);
            }
        }

        function disconnectMQTT() {
            if (!client) {
                setConnectedState(false);
                setStatus("⚪ MQTT 未连接", "#64748b");
                return;
            }

            const oldClient = client;

            client = null;
            isConnected = false;

            oldClient.removeAllListeners();
            oldClient.end(true);

            setConnectedState(false);
            setStatus("⚪ 已主动断开 MQTT", "#64748b");

            console.log("MQTT manually disconnected");
        }

        function publishAngle(topic, angle) {
            if (
                !client ||
                !isConnected ||
                !client.connected
            ) {
                setStatus(
                    "⚠️ MQTT 尚未连接，无法发送",
                    "#f39c12"
                );
                return;
            }

            const safeAngle = Math.max(
                0,
                Math.min(180, Number(angle))
            );

            const payload = JSON.stringify({
                angle: safeAngle
            });

            client.publish(
                topic,
                payload,
                {
                    qos: 1,
                    retain: false
                },
                function (error) {
                    if (error) {
                        setStatus(
                            "❌ 消息发送失败：" + error.message,
                            "#e74c3c"
                        );

                        console.error("Publish error:", error);
                        return;
                    }

                    setStatus(
                        "✅ 已发送 " +
                        topic +
                        " → " +
                        safeAngle +
                        "°",
                        "#27ae60"
                    );

                    console.log(
                        "Published:",
                        topic,
                        payload
                    );
                }
            );
        }

        function schedulePublish(topic, angle, servoNumber) {
            if (servoNumber === 1) {
                clearTimeout(servo1Timer);

                servo1Timer = setTimeout(function () {
                    publishAngle(topic, angle);
                }, 80);
            } else {
                clearTimeout(servo2Timer);

                servo2Timer = setTimeout(function () {
                    publishAngle(topic, angle);
                }, 80);
            }
        }

        slider1.addEventListener("input", function () {
            const angle = Number(this.value);

            value1.textContent = angle + "°";

            schedulePublish(
                MQTT_TOPIC_1,
                angle,
                1
            );
        });

        slider2.addEventListener("input", function () {
            const angle = Number(this.value);

            value2.textContent = angle + "°";

            schedulePublish(
                MQTT_TOPIC_2,
                angle,
                2
            );
        });

        connectButton.addEventListener(
            "click",
            connectMQTT
        );

        disconnectButton.addEventListener(
            "click",
            disconnectMQTT
        );

        // 在密码框按 Enter 也能连接
        mqttPassInput.addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Enter") {
                    connectMQTT();
                }
            }
        );

        window.addEventListener("beforeunload", function () {
            if (client) {
                client.removeAllListeners();
                client.end(true);
            }
        });
    </script>
</body>
</html>
